<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>GLB thumbnail renderer</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/three/build/three.module.js"
        }
      }
    </script>
    <style>
      html, body { margin: 0; overflow: hidden; background: #d9dde5; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from "/three/build/three.module.js";
      import { GLTFLoader } from "/three/examples/jsm/loaders/GLTFLoader.js";

      const topView = new URLSearchParams(location.search).get("top") === "1";
      const size = 900;
      const panelSize = topView ? size : size / 2;
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        preserveDrawingBuffer: true,
      });
      renderer.setSize(size, size, false);
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      renderer.shadowMap.enabled = true;
      document.body.append(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xd9dde5);
      scene.add(new THREE.HemisphereLight(0xffffff, 0x596171, 2.4));
      const key = new THREE.DirectionalLight(0xffffff, 3.2);
      key.position.set(4, 7, 5);
      key.castShadow = true;
      scene.add(key);
      const fill = new THREE.DirectionalLight(0xbad4ff, 1.8);
      fill.position.set(-4, 3, -3);
      scene.add(fill);

      const gltf = await new GLTFLoader().loadAsync("/model.glb");
      const model = gltf.scene;
      model.traverse((object) => {
        if (object.isMesh) {
          object.castShadow = true;
          object.receiveShadow = true;
        }
      });
      scene.add(model);

      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const dimensions = box.getSize(new THREE.Vector3());
      const floorY = box.min.y;
      const maxHorizontal = Math.max(dimensions.x, dimensions.z);
      const viewSize = topView
        ? maxHorizontal * 1.12
        : Math.max(dimensions.y * 1.18, maxHorizontal * 1.12);
      const halfView = viewSize / 2;
      const camera = new THREE.OrthographicCamera(
        -halfView,
        halfView,
        halfView,
        -halfView,
        0.01,
        viewSize * 20,
      );

      const floor = new THREE.Mesh(
        new THREE.CircleGeometry(viewSize * 0.55, 96),
        new THREE.MeshStandardMaterial({
          color: 0xb8bec9,
          roughness: 0.95,
          metalness: 0,
        }),
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = floorY - viewSize * 0.004;
      floor.receiveShadow = true;
      scene.add(floor);

      const target = new THREE.Vector3(center.x, center.y, center.z);
      const elevation = dimensions.y * 0.08;
      const distance = viewSize * 8;
      const angles = topView ? [0] : [0, Math.PI / 2, Math.PI, Math.PI * 1.5];
      renderer.setScissorTest(true);
      for (let index = 0; index < angles.length; index += 1) {
        const angle = angles[index];
        const column = topView ? 0 : index % 2;
        const row = topView ? 0 : Math.floor(index / 2);
        const x = column * panelSize;
        const y = topView ? 0 : (1 - row) * panelSize;
        renderer.setViewport(x, y, panelSize, panelSize);
        renderer.setScissor(x, y, panelSize, panelSize);
        if (topView) {
          camera.up.set(0, 0, -1);
          camera.position.set(center.x, center.y + distance, center.z);
        } else {
          camera.position.set(
            center.x + Math.sin(angle) * distance,
            center.y + elevation,
            center.z + Math.cos(angle) * distance,
          );
        }
        camera.lookAt(target);
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
      }

      renderer.domElement.toBlob(async (blob) => {
        try {
          await fetch("/result", {
            method: "POST",
            body: blob,
          });
        } catch (error) {
          await fetch("/failure", {
            method: "POST",
            body: String(error?.stack || error),
          });
        }
      }, "image/png");
    </script>
  </body>
</html>
